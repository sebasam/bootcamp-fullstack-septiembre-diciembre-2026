<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisores, listas</title>
</head>
<body>
    <!-- etiquetas divisoras se usan para contener -->
    <div>
        <h1>Hola soy un encabezado</h1>
    </div>
    <div>
        <p>Hola soy un parrafo</p>
    </div>

    <!-- listas -->
    <ul>
        <li>Item de lista</li>
        <li>Item de lista</li>
        <li>Item de lista</li>
    </ul>
    <ol>
        <li>Item de lista</li>
        <li>Item de lista</li>
        <li>Item de lista</li>
    </ol>

    <hr>

    <a href="">Enlace 1</a>
    <br>
    <a href="">Enlace 2</a>
</body>
</html>
