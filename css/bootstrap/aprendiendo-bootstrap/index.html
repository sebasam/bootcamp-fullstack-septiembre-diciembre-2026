<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendiendo Flex y Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light text-dark overflow-x-hidden">
    <!-- contenedor principal -->
    <div class="container-fluid p-0 d-flex flex-column min-vh-100">

        <!-- Barra de navegacion y logo  -->
        <header class="navbar navbar-expand-lg bg-dark px-4 py-3">
            <div class="container-fluid p-0">
                <a class="navbar-brand fw-bold fs-4" href="#">MiPortafolio</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <nav class="navbar-nav gap-3">
                        <a class="nav-link text-white" href="#">Elemento</a>
                        <a class="nav-link text-white" href="#">Elemento</a>
                        <a class="nav-link text-white" href="#">Elemento</a>
                    </nav>
                </div>
            </div>
        </header>

        <div class="row flex-grow-1">
            <aside class="col-12 col-md-4 col-lg-3 bg-white border-end p-5 d-flex flex-column align-items-center gap-3">
                <div class="profile">
                    <img src="https://placehold.co/120x120/3498db/white?text=Foto" alt="avatar" class="rounded-circle border border-primary border-4 mb-3" style="width: 120px; height: 120px; object-fit: cover;">
                    <h3>Jane Doe</h3>
                    <p>Diseñadore Web & UI/UX</p>
                    <button class="btn btn-primary px-4 py-2 fw-bold w-100">Seguir</button>
                </div>
            </aside>

            <!-- contenido principal - la galeria del usuario -->
            <main class="col-12 col-md-8 col-lg-9 p-4 p-md-5">
                <h2 class="text-dark border-bottom border-primary border-2 d-inline-block pb-2 mb-4">Galería de proyectos</h2>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+1" alt="proyecto" class="img-fluid w-100">
                    </div>

                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+2" alt="proyecto" class="img-fluid w-100">
                    </div>
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+3" alt="proyecto" class="img-fluid w-100">
                    </div>
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+4" alt="proyecto" class="img-fluid w-100">
                    </div>
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+5" alt="proyecto" class="img-fluid w-100">
                    </div>
                    <div class="col">
                        <img src="https://placehold.co/400x300/2c3e50/white?text=Proyecto+6" alt="proyecto" class="img-fluid w-100">
                    </div>
                </div>
            </main>
        </div>

        

        <!-- footer o pie de pagina -->
        <footer class="bg-dark text-secondary text-center p-4 mt-auto">
            <p>&copy; 2026 - Bootcamp Flexbox y Grid</p>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
